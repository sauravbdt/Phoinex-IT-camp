<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>{{ test.title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


<div class="container py-5">

    <a
        href="{% url 'examiner_dashboard' %}"
        class="btn btn-secondary mb-4"
    >
        ← Back to Dashboard
    </a>


    <div class="card shadow">

        <div class="card-body">

            <h1>{{ test.title }}</h1>

            <p class="text-muted">
                {{ test.description }}
            </p>

            <hr>


            <h3>IELTS Sections</h3>


            {% for section in test.sections.all %}

                <div class="card mt-3">

                    <div class="card-body">

                        <h4>
                            {{ section.title }}
                        </h4>

                        <p>
                            Type:
                            {{ section.section_type }}
                        </p>

                        <p>
                            Questions:
                            {{ section.questions.count }}
                        </p>

                        <a
    href="{% url 'section_detail' section.id %}"
    class="btn btn-primary"
>
    Manage Section
</a>

                    </div>

                </div>

            {% empty %}

                <div class="alert alert-info mt-3">

                    No sections have been created yet.

                </div>

            {% endfor %}


        </div>

    </div>

</div>


</body>

</html>
